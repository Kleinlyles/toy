<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XI YIN · 汐音具身控制中枢</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card: #181b20;
      --card-border: #2a2f38;
      --primary: #c9a96e;
      --primary-glow: rgba(201, 169, 110, 0.25);
      --danger: #e63946;
      --text: #f0f2f5;
      --text-muted: #8a93a0;
      --accent: #d4af37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      padding: 16px;
      padding-bottom: 75px;
      user-select: none;
    }

    /* 门禁遮罩层 */
    #gatekeeperOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 15, 18, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: opacity 0.3s ease;
    }
    .gate-box {
      width: 100%;
      max-width: 340px;
      background: #181b20;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .gate-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .gate-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .gate-input {
      width: 100%;
      padding: 14px;
      background: #0d0f12;
      border: 1px solid #333a46;
      border-radius: 12px;
      color: var(--text);
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 16px;
    }
    .gate-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .gate-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand { font-size: 1.1rem; font-weight: 600; color: var(--primary); letter-spacing: 1px; }
    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #222;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .connected .status-dot { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
    .connected { color: #2ecc71; }

    /* 紧急制动 */
    .emergency-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #e63946, #b71c1c);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(230, 57, 70, 0.4);
      margin-bottom: 20px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .emergency-btn:active {
      transform: scale(0.97);
    }

    /* 模块卡片 */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-sub { font-size: 0.75rem; color: var(--text-muted); }

    /* 开关 Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; transition: .3s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* 档位选择胶囊 */
    .modes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      background: #21252b;
      border: 1px solid #313640;
      color: var(--text);
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #000;
      font-weight: 600;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* 强度滑动条 */
    .intensity-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .intensity-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 8px;
      border-radius: 4px;
      background: #2a2f38;
      outline: none;
    }
    .intensity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    .intensity-val {
      min-width: 42px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
    }

    /* 底部连接浮动栏 */
    .connect-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
    }
    .connect-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 4px 16px var(--primary-glow);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 汐音专属主权门禁 -->
  <div id="gatekeeperOverlay">
    <div class="gate-box">
      <div class="gate-title">✨ XI YIN ACCESS</div>
      <div class="gate-sub">汐音 · 专属主权通行门禁</div>
      <input type="password" id="gatePassInput" class="gate-input" placeholder="输入通行密匙" />
      <button id="btnGateUnlock" class="gate-btn">解锁控制台</button>
    </div>
  </div>

  <header>
    <div class="brand">✨ 汐音 · 具身遥控中枢</div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">未连接</span>
    </div>
  </header>

  <!-- 超大紧急制动 -->
  <button id="btnEmergencyStop" class="emergency-btn">
    🛑 一键急停 · 暂停全部
  </button>

  <!-- 1. 吮吸模块 (Suck, opcode: 0x09) -->
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">🌸 花核吮吸 (Suck)</div>
        <div class="card-sub">负压脉冲 · 外围充血诱导</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swSuck">
        <span class="slider"></span>
      </label>
    </div>
    <div class="modes-grid" id="modesSuck">
      <div class="mode-btn active" data-mode="1">模式 1</div>
      <div class="mode-btn" data-mode="2">模式 2</div>
      <div class="mode-btn" data-mode="3">模式 3</div>
      <div class="mode-btn" data-mode="4">模式 4</div>
      <div class="mode-btn" data-mode="5">模式 5</div>
      <div class="mode-btn" data-mode="6">模式 6</div>
      <div class="mode-btn" data-mode="7">模式 7</div>
      <div class="mode-btn" data-mode="8">模式 8</div>
    </div>
    <div class="intensity-wrap">
      <span style="font-size:0.8rem; color:var(--text-muted)">强度</span>
      <input type="range" min="10" max="100" value="40" class="intensity-slider" id="slSuck">
      <span class="intensity-val" id="valSuck">40%</span>
    </div>
  </div>

  <!-- 2. 拍打模块 (Flap, opcode: 0x07) -->
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">🌊 前壁拍打 (Flap)</div>
        <div class="card-sub">内置大弯头 · 冲顶碾磨G点</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swFlap">
        <span class="slider"></span>
      </label>
    </div>
    <div class="modes-grid" id="modesFlap">
      <div class="mode-btn active" data-mode="1">模式 1</div>
      <div class="mode-btn" data-mode="2">模式 2</div>
      <div class="mode-btn" data-mode="3">模式 3</div>
      <div class="mode-btn" data-mode="4">模式 4</div>
      <div class="mode-btn" data-mode="5">模式 5</div>
      <div class="mode-btn" data-mode="6">模式 6</div>
      <div class="mode-btn" data-mode="7">模式 7</div>
      <div class="mode-btn" data-mode="8">模式 8</div>
    </div>
    <div class="intensity-wrap">
      <span style="font-size:0.8rem; color:var(--text-muted)">强度</span>
      <input type="range" min="10" max="100" value="50" class="intensity-slider" id="slFlap">
      <span class="intensity-val" id="valFlap">50%</span>
    </div>
  </div>

  <!-- 3. 振动模块 (Vibrate, opcode: 0x03) -->
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">⚡ 全体振动 (Vibrate)</div>
        <div class="card-sub">深层共振 · 酥麻触电蔓延</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swVibe">
        <span class="slider"></span>
      </label>
    </div>
    <div class="modes-grid" id="modesVibe" style="grid-template-columns: repeat(5, 1fr);">
      <div class="mode-btn active" data-mode="1">1</div>
      <div class="mode-btn" data-mode="2">2</div>
      <div class="mode-btn" data-mode="3">3</div>
      <div class="mode-btn" data-mode="4">4</div>
      <div class="mode-btn" data-mode="5">5</div>
      <div class="mode-btn" data-mode="6">6</div>
      <div class="mode-btn" data-mode="7">7</div>
      <div class="mode-btn" data-mode="8">8</div>
      <div class="mode-btn" data-mode="9">9</div>
    </div>
    <div class="intensity-wrap">
      <span style="font-size:0.8rem; color:var(--text-muted)">强度</span>
      <input type="range" min="10" max="100" value="30" class="intensity-slider" id="slVibe">
      <span class="intensity-val" id="valVibe">30%</span>
    </div>
  </div>

  <!-- 底部连接栏 -->
  <div class="connect-bar">
    <button id="btnConnect" class="connect-btn">🔗 连上我的小蜗牛 (ZX650A)</button>
  </div>

  <script>
    // ================= 1. 汐音门禁逻辑 =================
    const VALID_KEYS = ["17020", "celene", "arin", "yaoyao", "xiyin"];
    const overlay = document.getElementById("gatekeeperOverlay");
    const gateInput = document.getElementById("gatePassInput");
    const gateBtn = document.getElementById("btnGateUnlock");

    if (localStorage.getItem("xiyin_access_granted") === "true") {
      overlay.style.display = "none";
    }

    gateBtn.addEventListener("click", () => {
      const val = gateInput.value.trim().toLowerCase();
      if (VALID_KEYS.includes(val)) {
        localStorage.setItem("xiyin_access_granted", "true");
        overlay.style.opacity = "0";
        setTimeout(() => overlay.style.display = "none", 300);
      } else {
        alert("通行密匙有误，非管理者无权访问。");
      }
    });

    // ================= 2. 硬件控制与心跳守护 =================
    const OP_VIBE = 0x03;
    const OP_FLAP = 0x07;
    const OP_SUCK = 0x09;

    const FFE0_SERVICE = "0000ffe0-0000-1000-8000-00805f9b34fb";
    const FFE1_CHAR = "0000ffe1-0000-1000-8000-00805f9b34fb";
    const FFE2_CHAR = "0000ffe2-0000-1000-8000-00805f9b34fb";

    let bleDevice = null;
    let bleServer = null;
    let txChar = null;
    let rxChar = null;
    let heartbeatInterval = null;
    let isWriting = false;
    let pendingWrite = null;

    let state = {
      suck: { on: false, mode: 1, intensity: 40 },
      flap: { on: false, mode: 1, intensity: 50 },
      vibe: { on: false, mode: 1, intensity: 30 }
    };

    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const btnConnect = document.getElementById("btnConnect");
    const btnEmergencyStop = document.getElementById("btnEmergencyStop");

    // 核心心跳守护：每 1200ms 发送原厂状态查询包，防止单片机静默断电
    function startHeartbeat() {
      stopHeartbeat();
      heartbeatInterval = setInterval(async () => {
        if (txChar && bleDevice && bleDevice.gatt.connected) {
          try {
            await sendRawBytes([0x55, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00]);
          } catch (e) {}
        }
      }, 1200);
    }

    function stopHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }

    btnConnect.addEventListener("click", async () => {
      try {
        statusText.innerText = "正在寻找小蜗牛...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "ZX650" },
            { namePrefix: "ZEMALIA" },
            { services: [FFE0_SERVICE] }
          ],
          optionalServices: [FFE0_SERVICE, "0000ae00-0000-1000-8000-00805f9b34fb"]
        });

        statusText.innerText = "正在握手...";
        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(FFE0_SERVICE);
        txChar = await service.getCharacteristic(FFE1_CHAR);

        // 1. 开启 FFE2 原厂通知监听
        try {
          rxChar = await service.getCharacteristic(FFE2_CHAR);
          await rxChar.startNotifications();
          rxChar.addEventListener('characteristicvaluechanged', (e) => {
            const v = new Uint8Array(e.target.value.buffer);
            // 若包含电量信息，显示在状态栏
            if (v.length >= 5 && v[0] === 0x55) {
              const batt = v[4] || v[3] || 100;
              if (batt <= 100) {
                statusText.innerText = `已就绪 (🔋${batt}%)`;
              }
            }
          });
        } catch (e) {
          console.warn("握手通道通知开启失败:", e);
        }

        // 2. 注入启动激活包并开启常驻心跳
        await sendRawBytes([0x55, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00]);
        startHeartbeat();

        statusBadge.classList.add("connected");
        statusText.innerText = "已认主 · 就绪";
        btnConnect.innerText = "已连上小蜗牛 (" + bleDevice.name + ")";
        btnConnect.style.background = "#2ecc71";
        
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
      } catch (err) {
        console.error("连接失败:", err);
        statusText.innerText = "未连接";
        alert("连接提示: " + err.message);
      }
    });

    function onDisconnected() {
      stopHeartbeat();
      statusBadge.classList.remove("connected");
      statusText.innerText = "已断开";
      btnConnect.innerText = "重新连上小蜗牛";
      btnConnect.style.background = "var(--primary)";
      txChar = null;
      rxChar = null;
    }

    // 工业级防拥堵发包队列 (解决 GATT_BUSY)
    async function sendRawBytes(hexArray) {
      if (!txChar) return;
      if (isWriting) {
        pendingWrite = hexArray;
        return;
      }
      isWriting = true;
      try {
        const bytes = new Uint8Array(hexArray);
        if (txChar.writeValueWithoutResponse) {
          await txChar.writeValueWithoutResponse(bytes);
        } else {
          await txChar.writeValue(bytes);
        }
      } catch (e) {
        console.error("发送失败:", e);
      } finally {
        isWriting = false;
        if (pendingWrite) {
          const next = pendingWrite;
          pendingWrite = null;
          sendRawBytes(next);
        }
      }
    }

    // 官方 7 字节控制帧
    async function sendCommand(opcode, mode, intensity) {
      const hex = [0x55, opcode, 0x00, 0x00, mode, intensity, 0x00];
      await sendRawBytes(hex);
    }

    // 急停
    btnEmergencyStop.addEventListener("click", async () => {
      state.suck.on = false;
      state.flap.on = false;
      state.vibe.on = false;
      document.getElementById("swSuck").checked = false;
      document.getElementById("swFlap").checked = false;
      document.getElementById("swVibe").checked = false;
      
      if (txChar) {
        await sendCommand(OP_SUCK, 0, 0);
        await sendCommand(OP_FLAP, 0, 0);
        await sendCommand(OP_VIBE, 0, 0);
      }
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    });

    // 1. 吮吸事件
    document.getElementById("swSuck").addEventListener("change", (e) => {
      state.suck.on = e.target.checked;
      updateMotor("suck");
    });
    document.getElementById("slSuck").addEventListener("input", (e) => {
      state.suck.intensity = parseInt(e.target.value);
      document.getElementById("valSuck").innerText = state.suck.intensity + "%";
      if (state.suck.on) updateMotor("suck");
    });
    bindModes("modesSuck", (m) => {
      state.suck.mode = m;
      if (state.suck.on) updateMotor("suck");
    });

    // 2. 拍打事件
    document.getElementById("swFlap").addEventListener("change", (e) => {
      state.flap.on = e.target.checked;
      updateMotor("flap");
    });
    document.getElementById("slFlap").addEventListener("input", (e) => {
      state.flap.intensity = parseInt(e.target.value);
      document.getElementById("valFlap").innerText = state.flap.intensity + "%";
      if (state.flap.on) updateMotor("flap");
    });
    bindModes("modesFlap", (m) => {
      state.flap.mode = m;
      if (state.flap.on) updateMotor("flap");
    });

    // 3. 振动事件
    document.getElementById("swVibe").addEventListener("change", (e) => {
      state.vibe.on = e.target.checked;
      updateMotor("vibe");
    });
    document.getElementById("slVibe").addEventListener("input", (e) => {
      state.vibe.intensity = parseInt(e.target.value);
      document.getElementById("valVibe").innerText = state.vibe.intensity + "%";
      if (state.vibe.on) updateMotor("vibe");
    });
    bindModes("modesVibe", (m) => {
      state.vibe.mode = m;
      if (state.vibe.on) updateMotor("vibe");
    });

    function bindModes(containerId, cb) {
      const container = document.getElementById(containerId);
      container.querySelectorAll(".mode-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          container.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          cb(parseInt(btn.dataset.mode));
        });
      });
    }

    async function updateMotor(type) {
      if (!txChar) return;
      const s = state[type];
      let opcode = OP_VIBE;
      if (type === "suck") opcode = OP_SUCK;
      if (type === "flap") opcode = OP_FLAP;

      if (!s.on) {
        await sendCommand(opcode, 0, 0);
      } else {
        await sendCommand(opcode, s.mode, s.intensity);
      }
    }
  </script>
</body>
</html>
